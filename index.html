<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-3EXV7TVH2K"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-3EXV7TVH2K');
  </script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>3rd Semester Notes – SVIT / VTU</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- Progress Bar -->
  <div class="progress-container">
    <div class="progress-bar" id="progressBar"></div>
  </div>

  <!-- Custom Cursor -->
  <div class="cursor" id="cursor"></div>
  <div class="cursor-dot" id="cursorDot"></div>

  <!-- Header -->
  <header class="main-header">
    <div class="header-content">
      <h1 class="site-title">
        <i class="fas fa-graduation-cap"></i>
        3rd Semester Notes
      </h1>
      <p class="site-subtitle">CSE • CSE (AI & ML) • CSE (DS) • ISE — SVIT / VTU</p>
      
      <div class="header-controls">
        <div class="search-container">
          <i class="fas fa-search search-icon"></i>
          <input type="text" id="searchInput" class="search-input" placeholder="Search notes..." autocomplete="off">
          <button class="search-clear" id="searchClear" style="display: none;">
            <i class="fas fa-times"></i>
          </button>
        </div>
        <button class="mode-toggle" id="modeToggle">
          <i class="fas fa-moon"></i>
        </button>
      </div>
    </div>
  </header>

  <!-- Main Content -->
  <main class="main-container">
    <div class="quick-stats" id="quickStats"></div>
    <div class="subjects-grid" id="subjectsContainer">
      <!-- Cards will be dynamically generated -->
    </div>
  </main>

  <!-- Scroll to Top Button -->
  <button class="scroll-to-top" id="scrollToTop" aria-label="Scroll to top">
    <i class="fas fa-arrow-up"></i>
  </button>

  <!-- Toast Notification -->
  <div class="toast" id="toast"></div>

  <!-- Footer -->
  <footer class="main-footer">
    <p>Crafted With Care ❤️ | ✉️ hamidbinaejaz@gmail.com</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
